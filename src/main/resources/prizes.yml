data:
  commands:
    ADRENALIN_VOUCHER:
      command: "crazyvouchers give adrenalin_ii %amount% %player%"
      display:
        material: NETHER_STAR
        name: "&6Adrenaline II"
        lore:
          - ''
          - '&eActivation: Right-click'
          - '&eIf you use this before a battle,'
          - '&eall your damage will increase'
          - '&efor 60 seconds'
    PIRATE_TREASURE_VOUCHER:
      command: "crazyvouchers give pirate_treasure %amount% %player%"
      display:
        material: GOLD_NUGGET
        name: "&9Pirate's Treasure"
        lore:
          - ''
          - '&eActivation: Right-click'
          - '&eYou get a random amount'
          - '&eof money between $500-$1000.'
    FLAPPY_VOUCHER:
      command: "crazyvouchers give flappy %amount% %player%"
      display:
        material: FEATHER
        name: "&9Flappy"
        lore:
          - ''
          - '&eActivation: Right-click'
          - '&eYou can jump higher'
          - '&efor 30 seconds'
    ANIMAL_SPEED_VOUCHER:
      command: "crazyvouchers give animal_speed %amount% %player%"
      display:
        material: RABBIT_FOOT
        name: "&4Animal Speed"
        lore:
          - ''
          - '&eActivation: Right-click'
          - '&eWhile this skill is active,'
          - '&eyou can move very fast for short distances'
          - '&efor 60 seconds'
