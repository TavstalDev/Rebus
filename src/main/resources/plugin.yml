main: io.github.tavstaldev.rebus.Rebus
version: '1.2.0'
api-version: '1.20.4'

name: Rebus
prefix: Rebus
authors: [ Tavstal ]
website: https://tavstaldev.github.io/

depend: [Citizens, Vault, ProtocolLib]

libraries:
  - com.zaxxer:HikariCP:6.3.0
  - org.postgresql:postgresql:42.7.11
  - com.github.ben-manes.caffeine:caffeine:3.2.2
  - redis.clients:jedis:7.5.2
  - fr.mrmicky:fastboard:2.2.0

commands:
    rebus:
        description: Main command for Rebus plugin.
        usage: |-
          /<command> help - Show help information
          /<command> menu - Open the Rebus menu
          /<command> info - Show plugin information
        aliases: [rb]
        permission: rebus.commands.rebus
        permission-message: You do not have permission to use this command.
    rebusadmin:
        description: Administrative command for Rebus plugin.
        usage: |-
            /<command> reload - Reload the plugin configuration
            /<command> npc - Spawn the Rebus NPC
            /<command> give <player> <reward> - Give a reward to a player
            /<command> reset <player> <data> - Reset player data
            /<command> stats <player> - Show player statistics
            /<command> chests - Manage reward chests
        aliases: [rba, rbadmin]
        permission: rebus.commands.rebusadmin
        permission-message: You do not have permission to use this command.

permissions:
  rebus.use:
    default: true
  rebus.commands.rebus:
    default: true
  rebus.commands.rebus.version:
    default: true
  rebus.commands.rebus.menu:
    default: op
  rebus.commands.rebusadmin:
    default: op
  rebus.commands.rebusadmin.npc:
    default: op
  rebus.commands.rebusadmin.give:
    default: op
  rebus.commands.rebusadmin.reload:
    default: op
  rebus.commands.rebusadmin.reset:
    default: op
