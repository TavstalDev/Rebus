npc:
  spawned: "%prefix% &aSuccessfully spawned the Rebus NPC."
  removed: "%prefix% &aSuccessfully removed the Rebus NPC."

chests:
  purchase-successful: "%prefix% &aYou have successfully bought &e%amount%x %chest%&a."
  open-successful: "%prefix% &aYou have successfully opened the &e%chest% &achest and won the following: %prizes%"
  prize-title:
    title: "&aCongratulations!"
    subtitle: "&eYou have won: %prizes%"
  error:
    not-found: "%prefix% &cThe '%chest%' chest was not found."
    no-rewards: "%prefix% &cThis chest has no rewards. Please contact an administrator to fix the configuration."
    already-opening: "%prefix% &cYou can't open multiple chests at once."
    location-occupied: "%prefix% &cThere's already a chest at that location."
    inventory-full: "%prefix% &cYour inventory is full! The items were dropped on the ground."
    use-cooldown: "%prefix% &cPlease wait &e%time% &cbefore opening this chest again."
    buy-inventory-full: "%prefix% &cYou don't have enough space in your inventory."
    buy-cooldown: "%prefix% &cYou can't buy a new chest yet. Please wait &e%time%&c."
    buy-while-opening: "%prefix% &cYou can't buy a new chest while opening one."
    transaction-ongoing: "%prefix% &cPlease wait for your ongoing transaction to complete."
    no-usages-left: "%prefix% &cPlacement blocked. Your account's chest usage quota is exhausted. (Anti-Dupe Layer: Physical items do not grant extra usages)."
  data:
    daily:
      name: "&aDaily Chest"
      lore:
        - ""
        - "&cQuality: &e✪&f✪✪✪✪"
        - "%price%"
        - ""
        - "%permission%"
        - "%preview%"
    default:
      name: "&aDefault Chest"
      lore:
        - ""
        - "&cQuality: &e✪✪&f✪✪✪"
        - "%price%"
        - ""
        - "&f &kiii&r &bYou are guaranteed to get 3 save rods upon opening. &f&kiiik&r"
        - ""
        - "%permission%"
        - "%preview%"
    pandora:
      name: "&aPandora's Box"
      lore:
        - ""
        - "&cQuality: &e✪✪✪&f✪✪"
        - "%price%"
        - ""
        - "&f &kiii&r &bYou are guaranteed to get 8 save rods upon opening. &f&kiiik&r"
        - ""
        - "%permission%"
        - "%preview%"
    choosen:
      name: "&aChoosen Chest"
      lore:
        - ""
        - "&cQuality: &e✪✪✪✪&f✪"
        - "%price%"
        - ""
        - "&f &kiii&r &bYou are guaranteed to get 18 save rods upon opening. &f&kiiik&r"
        - ""
        - "%permission%"
        - "%preview%"

commands:
  error:
    console-caller: "%prefix% &cOnly players can use this command."
    unknown-error: "%prefix% &cAn unknown error occurred. Please report it!"
    invalid-arguments: "%prefix% &cInvalid arguments."
    invalid-page: "%prefix% &cInvalid page number."
  help:
    desc: "Shows info about the commands."
    title: "&8&m        &r &bRebus &7Help &8&m    &r &7Page &3%current_page%&7/&3%max_page% &8&m        &r"
    info: |-
      &r
      &r  &c&l[]&r &8- &7Required,   &e&l<>&r &8- &7Optional
      &r
    line: "&r  &b/%command% %subcommand%&3%syntax% &8- &7%description%"
    bottom: |-
      &r
      &8&m                       &r %previous_btn%&3%current_page%&7/&3%max_page%%next_btn% &8&m                       &r
    previous-button: "&b<< "
    next-button: " &b>>"
  version:
    desc: "Shows the plugin version."
    header: "&8&m                                                "
    current: "%prefix% &aYou're using Rebus version '&3%version%&a' made by &3Tavstal&e."
    bottom: "&8&m                                                "
    up-to-date: "%prefix% &aRebus is up to date."
    outdated: "%prefix% &aRebus is outdated. Download it here: &e%link%"
  reload:
    desc: "Reloads the plugin config and messages."
    done: "%prefix% &aPlugin reloaded."
  menu:
    desc: "Opens the Rebus menu."
    no-chests: "%prefix% &cNo chests are available."
  npc:
    desc: "Spawns the Rebus NPC."
  give:
    syntax: " <player> <reward>"
    desc: "Gives a chest to a player."
    given: "%prefix% &aSuccessfully gave &e%chest% &achest to &e%player%&a."
    received: "%prefix% &aYou received an &e%chest% &achest."
  reset:
    syntax: " <player>"
    desc: "Resets all cooldowns of a player."
    reset-cooldowns-for: "%prefix% &aYou have successfully reset all cooldowns of &e%player%&a."
    reseted-by-admin: "%prefix% &aAll of your chest cooldowns has been reset by an admin."


